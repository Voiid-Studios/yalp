name: Deploy JavaDocs

on:
  push:
    branches-ignore:
      - docs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-javadocs:
    if: ${{ github.ref_name != 'docs' }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate version branch
        id: branch
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" =~ ^[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Using version branch: $BRANCH"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Skipping branch: $BRANCH"
          fi

      - name: Checkout source branch
        if: steps.branch.outputs.valid == 'true'
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Java 25
        if: steps.branch.outputs.valid == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build project and JavaDocs
        if: steps.branch.outputs.valid == 'true'
        working-directory: source
        run: |
          mvn -B clean package
          mvn -B javadoc:aggregate

      - name: Prepare JavaDocs site
        if: steps.branch.outputs.valid == 'true'
        run: |
          rm -rf javadocs-site
          mkdir -p javadocs-site

          if [ -f source/target/site/apidocs/index.html ]; then
            echo "Using source/target/site/apidocs"
            cp -R source/target/site/apidocs/. javadocs-site/
          elif [ -f source/target/site/apidocs/apidocs/index.html ]; then
            echo "Using nested source/target/site/apidocs/apidocs"
            cp -R source/target/site/apidocs/apidocs/. javadocs-site/
          else
            echo "JavaDocs index.html not found."
            echo "Generated files:"
            find source/target/site -maxdepth 5 -type f | sort || true
            exit 1
          fi

          # Extra safety: if something still leaves apidocs inside the output,
          # flatten it so the final URL is /yalp/ instead of /yalp/apidocs/.
          if [ ! -f javadocs-site/index.html ] && [ -f javadocs-site/apidocs/index.html ]; then
            echo "Flattening apidocs folder..."

            TEMP_DIR="$(mktemp -d)"
            cp -R javadocs-site/apidocs/. "$TEMP_DIR/"

            find javadocs-site -mindepth 1 -maxdepth 1 -exec rm -rf {} +

            cp -R "$TEMP_DIR/." javadocs-site/
            rm -rf "$TEMP_DIR"
          fi

          touch javadocs-site/.nojekyll

      - name: Deploy to docs branch
        if: steps.branch.outputs.valid == 'true'
        env:
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          cd javadocs-site

          git init
          git checkout -b docs

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No JavaDocs changes to deploy."
            exit 0
          fi

          git commit -m "Deploy JavaDocs from ${GITHUB_REF_NAME} (${GITHUB_SHA})"

          git remote add origin https://x-access-token:${DOCS_DEPLOY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push --force origin docs
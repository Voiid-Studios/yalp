name: Deploy JavaDocs

on:
  push:
    branches-ignore:
      - docs
  workflow_dispatch:

jobs:
  deploy-javadocs:
    if: ${{ github.ref_name != 'docs' }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate version branch
        id: branch
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [[ "$BRANCH" =~ ^[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Using version branch: $BRANCH"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Skipping branch: $BRANCH"
          fi

      - name: Checkout source branch
        if: steps.branch.outputs.valid == 'true'
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Java
        if: steps.branch.outputs.valid == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Build JavaDocs
        if: steps.branch.outputs.valid == 'true'
        working-directory: source
        run: |
          mvn clean package
          mvn javadoc:aggregate

      - name: Checkout docs branch
        if: steps.branch.outputs.valid == 'true'
        uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-branch
          token: ${{ secrets.DOCS_DEPLOY_TOKEN }}

      - name: Replace only JavaDocs folder
        if: steps.branch.outputs.valid == 'true'
        run: |
          rm -rf docs-branch/jd
          mkdir -p docs-branch/jd

          cp -R source/target/site/apidocs/. docs-branch/jd/

          # If Maven or the workflow leaves everything inside jd/apidocs/,
          # flatten it into jd/ directly.
          if [ -d docs-branch/jd/apidocs ]; then
            echo "Flattening jd/apidocs into jd..."

            TEMP_DIR="$(mktemp -d)"
            cp -R docs-branch/jd/apidocs/. "$TEMP_DIR/"

            find docs-branch/jd -mindepth 1 -maxdepth 1 -exec rm -rf {} +

            cp -R "$TEMP_DIR/." docs-branch/jd/
            rm -rf "$TEMP_DIR"
          fi

          touch docs-branch/.nojekyll

      - name: Commit and push JavaDocs
        if: steps.branch.outputs.valid == 'true'
        working-directory: docs-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jd .nojekyll

          if git diff --cached --quiet; then
            echo "No JavaDocs changes to deploy."
            exit 0
          fi

          git commit -m "Update JavaDocs from ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          git push origin docs